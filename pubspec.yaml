name: font_awesome_pro_flutter
description: |
  Simple, opinionated, code generator for FontAwesome pro icons.

version: 0.1.0
homepage: https://github.com/heftapp/font_awesome_pro_flutter
repository: https://github.com/heftapp/font_awesome_pro_flutter
licence: MIT

environment:
  sdk: '>=3.5.0 <4.0.0'

# Deliberately minimal. Every dependency here is pure Dart and free of
# `analyzer`, so this package never constrains the analyzer version and can
# never block `riverpod_generator`, `freezed` or `json_serializable` from
# resolving. Ranges are widened to whole majors rather than carets for the
# same reason. See README.md#dependency-policy before adding to this list.
dependencies:
  build: '>=4.0.0 <5.0.0'
  glob: '>=2.0.0 <3.0.0'
  path: '>=1.8.0 <2.0.0'
  recase: '>=4.0.0 <5.0.0'

dev_dependencies:
  build_runner: '>=2.10.0 <3.0.0'
  build_test: '>=3.5.0 <4.0.0'
  test: '>=1.24.0 <2.0.0'
